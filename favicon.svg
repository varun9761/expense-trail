<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e36"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>

    <!-- Emerald Coin Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cf5be"/>
      <stop offset="60%" stop-color="#3dd69b"/>
      <stop offset="100%" stop-color="#1ea877"/>
    </linearGradient>

    <!-- Subtle Coin Inner Specular -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#22b285" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Background Growth Trail Accent -->
  <path d="M12 48 Q 24 44, 30 36 T 52 16" fill="none" stroke="#22b285" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="2 3"/>

  <!-- Center Money Coin with Emerald Glow -->
  <circle cx="32" cy="32" r="22" fill="#1ea877" opacity="0.2" filter="url(#softGlow)"/>
  <circle cx="32" cy="32" r="20" fill="url(#emeraldGrad)"/>
  <circle cx="32" cy="32" r="20" fill="url(#specular)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Currency / Money Symbol ($) in deep obsidian contrast -->
  <path d="
    M32 18 V22
    M32 42 V46
    M35.5 24.5 C35.5 24.5 30 23.5 28 26 C26.2 28.2 27.5 31.5 32 32.5 C36.8 33.5 38.5 36.5 36.5 39 C34.5 41.5 28.5 40.5 28.5 40.5
  " fill="none" stroke="#062218" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
